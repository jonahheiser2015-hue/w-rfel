<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <meta name="description" content="Würfle los – ein digitaler Würfel für deinen nächsten Spieleabend.">
  <title>Würfelzeit – Dein digitaler Würfel</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24251f;
      --muted: #77786f;
      --paper: #f5f4ef;
      --card: #fffefa;
      --green: #42664f;
      --green-dark: #304d3b;
      --green-pale: #e8eee7;
      --line: #e8e6dd;
      --shadow: 0 24px 70px rgb(40 43 34 / 9%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 36%, rgb(255 255 255 / 85%), transparent 52%),
        var(--paper);
    }

    button { font: inherit; }

    .page {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      padding: 24px clamp(20px, 5vw, 72px) 20px;
    }

    .topbar {
      display: flex;
      width: min(100%, 1120px);
      align-items: center;
      justify-content: space-between;
      margin: 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.03em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid #d7dfd4;
      border-radius: 11px;
      color: var(--green);
      background: #edf1e9;
    }

    .brand-mark svg { width: 19px; height: 19px; }

    .top-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 550;
    }

    main {
      display: grid;
      flex: 1;
      place-items: center;
      padding: 42px 0;
    }

    .app {
      width: min(100%, 680px);
      padding: clamp(26px, 6vw, 52px);
      border: 1px solid rgb(232 230 221 / 90%);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 13px;
      color: var(--green);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #89a586;
      content: "";
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 52px);
      font-weight: 760;
      letter-spacing: -.065em;
      line-height: 1.08;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .dice-area {
      display: flex;
      min-height: 176px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin: 24px 0 18px;
    }

    .die {
      --die-size: clamp(58px, 16vw, 108px);
      --die-depth: calc(var(--die-size) / 2);
      width: var(--die-size);
      height: var(--die-size);
      flex: 0 0 var(--die-size);
      perspective: 650px;
    }

    .die-cube {
      position: relative;
      width: 100%;
      height: 100%;
      transform: var(--orientation, rotateX(-18deg) rotateY(-24deg));
      transform-style: preserve-3d;
      transition: transform .55s cubic-bezier(.2, .75, .25, 1);
    }

    .die.rolling .die-cube {
      animation: tumble .65s linear infinite;
      transition: none;
    }

    .die-face {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 15%;
      border: 1px solid #dddcd3;
      border-radius: 19%;
      background: linear-gradient(145deg, #fff 0%, #f5f4ed 100%);
      box-shadow: inset 0 1px 0 #fff, inset 0 -2px 3px rgb(44 46 37 / 5%);
      backface-visibility: hidden;
    }

    .die-face--front { transform: translateZ(var(--die-depth)); }
    .die-face--back { transform: rotateY(180deg) translateZ(var(--die-depth)); }
    .die-face--right { transform: rotateY(90deg) translateZ(var(--die-depth)); }
    .die-face--left { transform: rotateY(-90deg) translateZ(var(--die-depth)); }
    .die-face--top { transform: rotateX(90deg) translateZ(var(--die-depth)); }
    .die-face--bottom { transform: rotateX(-90deg) translateZ(var(--die-depth)); }

    .pip {
      align-self: center;
      justify-self: center;
      width: 67%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--green);
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 20%), 0 1px 1px rgb(255 255 255 / 80%);
    }

    @keyframes tumble {
      to { transform: rotateX(720deg) rotateY(1080deg) rotateZ(360deg) scale(.94); }
    }

    .result {
      min-height: 30px;
      color: var(--muted);
      font-size: 13px;
    }

    .result strong { color: var(--ink); font-weight: 700; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 21px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #fff;
    }

    .quantity-label {
      margin-right: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .stepper-button {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 0;
      border-radius: 10px;
      color: var(--ink);
      background: #f4f3ed;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      transition: background .18s, transform .18s;
    }

    .stepper-button:hover:not(:disabled) { background: #eae9e1; }
    .stepper-button:active:not(:disabled) { transform: scale(.93); }
    .stepper-button:disabled { color: #b9b8b0; cursor: not-allowed; }

    .count {
      min-width: 16px;
      font-size: 14px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .roll-button {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 24px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      background: var(--green);
      box-shadow: 0 7px 14px rgb(66 102 79 / 20%);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: background .18s, transform .18s, box-shadow .18s;
    }

    .roll-button:hover { background: var(--green-dark); box-shadow: 0 9px 18px rgb(66 102 79 / 27%); }
    .roll-button:active { transform: translateY(1px) scale(.98); }
    .roll-button:disabled { cursor: wait; opacity: .8; }
    .roll-button svg { width: 17px; height: 17px; }

    button:focus-visible {
      outline: 3px solid #a6bea4;
      outline-offset: 3px;
    }

    .hint {
      margin: 15px 0 0;
      color: #96968d;
      font-size: 11px;
    }

    .history {
      margin-top: 32px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      text-align: left;
    }

    .history-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .history-title {
      margin: 0;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .01em;
    }

    .clear-button {
      padding: 5px 0 5px 8px;
      border: 0;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
    }

    .clear-button:hover { color: var(--green-dark); }

    .history-list {
      display: flex;
      min-height: 33px;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font-size: 11px;
    }

    .history-values { color: var(--muted); font-variant-numeric: tabular-nums; }
    .history-total { font-weight: 750; font-variant-numeric: tabular-nums; }
    .empty-history { align-self: center; color: #96968d; font-size: 11px; }

    footer {
      color: #96968d;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .page { padding: 17px 16px 15px; }
      .top-note { font-size: 11px; }
      main { padding: 24px 0; }
      .app { padding: 30px 20px 22px; border-radius: 23px; }
      .dice-area { min-height: 160px; margin: 20px 0 12px; }
      .controls { flex-direction: column; gap: 12px; margin-top: 16px; }
      .quantity { justify-content: space-between; width: min(100%, 240px); }
      .roll-button { width: min(100%, 240px); }
      .history { margin-top: 25px; padding-top: 18px; }
      .hint { margin-top: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="4" y="4" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/>
            <circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.2" fill="currentColor"/>
            <circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/>
            <circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/>
          </svg>
        </span>
        Würfelzeit
      </div>
      <span class="top-note">Dein Glück ist nur einen Wurf entfernt.</span>
    </header>

    <main>
      <section class="app" aria-labelledby="title">
        <p class="eyebrow">Dein digitaler Würfel</p>
        <h1 id="title">Zeit zu würfeln.</h1>
        <p class="subtitle">Einmal tippen. Und das Spiel kann beginnen.</p>

        <div class="dice-area" id="dice-area" aria-label="Noch nicht gewürfelt"></div>
        <p class="result" id="result" aria-live="polite">Dein Wurf wartet auf dich.</p>

        <div class="controls">
          <div class="quantity" aria-label="Anzahl der Würfel">
            <span class="quantity-label">Würfel</span>
            <button class="stepper-button" id="decrease" type="button" aria-label="Würfelanzahl verringern">−</button>
            <output class="count" id="count" aria-live="polite">1</output>
            <button class="stepper-button" id="increase" type="button" aria-label="Würfelanzahl erhöhen">+</button>
          </div>
          <button class="roll-button" id="roll" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor"/>
              <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor"/>
            </svg>
            <span>Würfeln</span>
          </button>
        </div>
        <p class="hint">Tipp: Drücke die Leertaste zum Würfeln.</p>

        <section class="history" aria-labelledby="history-title">
          <div class="history-heading">
            <h2 class="history-title" id="history-title">Letzte Würfe</h2>
            <button class="clear-button" id="clear" type="button" hidden>Verlauf leeren</button>
          </div>
          <ol class="history-list" id="history" aria-live="polite">
            <li class="empty-history">Deine Würfe erscheinen hier.</li>
          </ol>
        </section>
      </section>
    </main>

    <footer>Für große und kleine Spielrunden.</footer>
  </div>

  <script>
    const diceArea = document.querySelector("#dice-area");
    const result = document.querySelector("#result");
    const countOutput = document.querySelector("#count");
    const decreaseButton = document.querySelector("#decrease");
    const increaseButton = document.querySelector("#increase");
    const rollButton = document.querySelector("#roll");
    const historyList = document.querySelector("#history");
    const clearButton = document.querySelector("#clear");
    const pipLayouts = {
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8]
    };
    const faceNames = ["front", "back", "right", "left", "top", "bottom"];
    const faceValues = [1, 6, 3, 4, 5, 2];
    const orientations = {
      1: "rotateX(-10deg) rotateY(-12deg)",
      2: "rotateX(-10deg) rotateY(-12deg) rotateX(90deg)",
      3: "rotateX(-10deg) rotateY(-12deg) rotateY(-90deg)",
      4: "rotateX(-10deg) rotateY(-12deg) rotateY(90deg)",
      5: "rotateX(-10deg) rotateY(-12deg) rotateX(-90deg)",
      6: "rotateX(-10deg) rotateY(-12deg) rotateY(180deg)"
    };
    let diceCount = 1;
    let rolling = false;
    let history = [];

    function updateControls() {
      countOutput.value = diceCount;
      countOutput.textContent = diceCount;
      decreaseButton.disabled = diceCount === 1 || rolling;
      increaseButton.disabled = diceCount === 6 || rolling;
    }

    function renderDice(values, animate = false) {
      diceArea.replaceChildren();
      diceArea.setAttribute("aria-label", values.length
        ? `Würfelergebnis: ${values.join(", ")}`
        : "Noch nicht gewürfelt");

      values.forEach((value, index) => {
        const die = document.createElement("div");
        die.className = `die${animate ? " rolling" : ""}`;
        die.setAttribute("role", "img");
        die.setAttribute("aria-label", `${value} ${value === 1 ? "Aug" : "Augen"}`);
        die.style.setProperty("--orientation", orientations[value]);

        const cube = document.createElement("div");
        cube.className = "die-cube";
        cube.setAttribute("aria-hidden", "true");
        faceNames.forEach((faceName, faceIndex) => {
          const face = document.createElement("div");
          face.className = `die-face die-face--${faceName}`;
          pipLayouts[faceValues[faceIndex]].forEach((position) => {
            const pip = document.createElement("span");
            pip.className = "pip";
            pip.style.gridArea = `${Math.floor(position / 3) + 1} / ${(position % 3) + 1}`;
            face.append(pip);
          });
          cube.append(face);
        });

        cube.style.animationDelay = `${index * 45}ms`;
        die.append(cube);
        diceArea.append(die);
      });
    }

    function renderHistory() {
      historyList.replaceChildren();
      clearButton.hidden = history.length === 0;

      if (history.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-history";
        empty.textContent = "Deine Würfe erscheinen hier.";
        historyList.append(empty);
        return;
      }

      history.forEach((entry) => {
        const item = document.createElement("li");
        item.className = "history-item";
        const values = document.createElement("span");
        values.className = "history-values";
        values.textContent = entry.values.join(" · ");
        const total = document.createElement("span");
        total.className = "history-total";
        total.textContent = `= ${entry.total}`;
        item.append(values, total);
        historyList.append(item);
      });
    }

    function rollDice() {
      if (rolling) return;
      rolling = true;
      updateControls();
      rollButton.disabled = true;
      rollButton.querySelector("span").textContent = "Würfelt …";
      result.textContent = "Die Würfel rollen …";

      const initialValues = Array.from({ length: diceCount }, () => 1);
      renderDice(initialValues, true);

      window.setTimeout(() => {
        const values = Array.from({ length: diceCount }, () => Math.floor(Math.random() * 6) + 1);
        const total = values.reduce((sum, value) => sum + value, 0);
        rolling = false;
        renderDice(values);
        result.innerHTML = `<strong>${total}</strong> ${total === 1 ? "Aug" : "Augen"} insgesamt`;
        history.unshift({ values, total });
        history = history.slice(0, 5);
        renderHistory();
        rollButton.disabled = false;
        rollButton.querySelector("span").textContent = "Nochmal würfeln";
        updateControls();
      }, 560);
    }

    decreaseButton.addEventListener("click", () => {
      if (diceCount > 1 && !rolling) {
        diceCount -= 1;
        updateControls();
        renderDice(Array.from({ length: diceCount }, () => 1));
      }
    });

    increaseButton.addEventListener("click", () => {
      if (diceCount < 6 && !rolling) {
        diceCount += 1;
        updateControls();
        renderDice(Array.from({ length: diceCount }, () => 1));
      }
    });

    rollButton.addEventListener("click", rollDice);
    clearButton.addEventListener("click", () => {
      history = [];
      renderHistory();
    });
    document.addEventListener("keydown", (event) => {
      if (event.code === "Space" && !event.repeat && !["BUTTON", "INPUT"].includes(document.activeElement.tagName)) {
        event.preventDefault();
        rollDice();
      }
    });

    updateControls();
    renderDice([1]);
  </script>
</body>
</html>
